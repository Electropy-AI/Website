<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Electropy</title>
<style>
  :root{--bg:#0b1220;--fg:#e6edf7;--muted:#7f8ba3;--accent:#3ee08f;--metal:#c9d3e3;--metal2:#94a3bb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(circle at 50% 40%,#13203a 0%,var(--bg) 70%);
       color:var(--fg);font-family:"Segoe UI",Arial,sans-serif;text-align:center;padding:16px;overflow:hidden}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
  .logo{height:34px;opacity:.9}
  svg{width:180px;height:auto;animation:hover 3s ease-in-out infinite}
  h1{font-size:clamp(22px,5vw,34px);font-weight:600;letter-spacing:.5px;margin:0}
  h1::after{content:"_";color:var(--accent);animation:blink 1s steps(1) infinite;margin-left:2px}
  /* robot parts */
  .antenna-tip{fill:var(--accent);animation:pulse 1.4s ease-in-out infinite}
  .eyes{animation:scan 4s ease-in-out infinite}
  .eye{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:blinkEye 5s infinite}
  .cell{fill:var(--accent);opacity:.15;animation:charge 3s infinite}
  .c2{animation-delay:.6s}.c3{animation-delay:1.2s}.c4{animation-delay:1.8s}
  .arm-l{transform-origin:62px 118px;animation:wave 3s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes scan{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
  @keyframes blinkEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes charge{0%{opacity:.15}20%,80%{opacity:1}100%{opacity:.15}}
  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="wrap">
   

    <svg viewBox="0 0 200 220" aria-hidden="true">
      <line x1="100" y1="20" x2="100" y2="42" stroke="#94a3bb" stroke-width="4"/>
      <circle class="antenna-tip" cx="100" cy="16" r="7"/>
      <rect x="55" y="42" width="90" height="62" rx="16" fill="#c9d3e3"/>
      <rect x="66" y="54" width="68" height="38" rx="10" fill="#0b1220"/>
      <g class="eyes">
        <rect class="eye" x="78" y="66" width="14" height="14" rx="4"/>
        <rect class="eye" x="108" y="66" width="14" height="14" rx="4"/>
      </g>
      <rect x="90" y="104" width="20" height="10" fill="#94a3bb"/>
      <rect x="60" y="114" width="80" height="72" rx="14" fill="#c9d3e3"/>
      <rect x="78" y="130" width="44" height="40" rx="5" fill="#0b1220"/>
      <rect x="94" y="125" width="12" height="5" rx="1" fill="#0b1220"/>
      <rect class="cell c4" x="83" y="135" width="34" height="6" rx="1"/>
      <rect class="cell c3" x="83" y="144" width="34" height="6" rx="1"/>
      <rect class="cell c2" x="83" y="153" width="34" height="6" rx="1"/>
      <rect class="cell"    x="83" y="162" width="34" height="5" rx="1"/>
      <g class="arm-l"><rect x="40" y="118" width="16" height="50" rx="8" fill="#94a3bb"/></g>
      <rect x="144" y="118" width="16" height="50" rx="8" fill="#94a3bb"/>
      <rect x="74" y="186" width="16" height="22" rx="5" fill="#94a3bb"/>
      <rect x="110" y="186" width="16" height="22" rx="5" fill="#94a3bb"/>
    </svg>

    <h1>Recharging.</h1>
  </div>
</body>
</html>
